<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Catálogo - Tu Tienda</title>
<link rel="icon" href="img/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06b6d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --primary-color: #06b6d4;
    --primary-dark: #0891b2;
    --secondary-color: #ef4444;
    --secondary-dark: #dc2626;
    --dark-bg: #0f172a;
    --light-text: #ffffff;
    --dark-text: #1e293b;
    --card-bg: #ffffff;
    --success: #10b981;
    --warning: #f59e0b;
    --gray-light: #f1f5f9;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--dark-bg);
    color: var(--light-text);
    min-height: 100vh;
  }
  
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: linear-gradient(135deg, var(--dark-bg) 0%, #1e293b 100%);
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: var(--shadow);
  }
  
  header img { height: 50px; width: auto; }
  
  .header-buttons { display: flex; gap: 10px; }
  
  .icon-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.3s;
  }
  
  .icon-btn:hover { background: var(--primary-color); transform: scale(1.05); }
  
  .categories { position: relative; }
  .cat-btn {
    padding: 10px 16px;
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .cat-list {
    position: absolute;
    top: 45px;
    right: 0;
    background: white;
    color: black;
    border-radius: 8px;
    display: none;
    flex-direction: column;
    min-width: 180px;
    z-index: 25;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .cat-list button {
    padding: 12px 16px;
    text-align: left;
    border: none;
    background: none;
    cursor: pointer;
  }
  .cat-list button:hover { background: #f1f5f9; }
  
  .search-section {
    padding: 16px;
    background: rgba(255,255,255,0.05);
    margin: 12px;
    border-radius: 16px;
  }
  #searchInput {
    width: 100%;
    padding: 12px 16px;
    border-radius: 40px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.3);
    color: white;
    font-size: 16px;
  }
  .filters-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .filters-row select {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
  }
  
  .products {
    display: grid;
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (min-width: 1024px) { .products { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 768px) and (max-width: 1023px) { .products { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 767px) { .products { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; } }
  
  .product {
    background: var(--card-bg);
    color: var(--dark-text);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
  }
  .product:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  
  .offer-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
  }
  
  .quantity-offer-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    z-index: 2;
  }
  
  .stock-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
  }
  .stock-badge.available { background: #10b981; color: white; }
  .stock-badge.low { background: #f59e0b; color: white; }
  .stock-badge.out { background: #ef4444; color: white; }
  
  .product img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    padding: 12px;
  }
  .product h3 { font-size: 14px; margin: 0 12px 4px; font-weight: 600; }
  .product .desc { font-size: 11px; color: #64748b; margin: 0 12px 8px; }
  .product .price { margin: 8px 12px; font-weight: 700; color: var(--primary-color); }
  .product .old-price {
    text-decoration: line-through;
    color: #94a3b8;
    font-size: 12px;
    margin-right: 6px;
  }
  .product .offer-info {
    font-size: 10px;
    color: #10b981;
    margin: 0 12px 8px;
  }
  .btn-add {
    margin: 12px;
    padding: 10px;
    background: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    width: calc(100% - 24px);
  }
  .btn-add:disabled {
    background: #94a3b8;
    cursor: not-allowed;
  }
  
  #cartBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--secondary-color);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    font-size: 24px;
    cursor: pointer;
    box-shadow: var(--shadow-lg);
    z-index: 99;
  }
  #cartBtn::after {
    content: attr(data-count);
    position: absolute;
    top: -5px;
    right: -5px;
    background: #ff9800;
    border-radius: 50%;
    padding: 3px 7px;
    font-size: 11px;
    min-width: 20px;
    display: none;
  }
  #cartBtn[data-count]:not([data-count="0"])::after { display: block; }
  
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    z-index: 200;
  }
  .modal-content {
    background: white;
    color: black;
    padding: 24px;
    border-radius: 20px;
    width: 90%;
    max-width: 350px;
    text-align: center;
  }
  .modal-content input, .modal-content select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 2px solid #e2e8f0;
  }
  
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 40px;
    z-index: 300;
    animation: fadeInOut 2.5s ease;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; bottom: 70px; }
    15% { opacity: 1; bottom: 90px; }
    85% { opacity: 1; bottom: 90px; }
    100% { opacity: 0; bottom: 70px; }
  }
  
  .history-panel {
    position: fixed;
    top: 0;
    right: -100%;
    width: 90%;
    max-width: 400px;
    height: 100%;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    z-index: 150;
    transition: right 0.3s;
    overflow-y: auto;
    padding: 20px;
  }
  .history-panel.open { right: 0; }
  .history-item {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<header>
  <img src="img/logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/50?text=Logo'">
  <div class="header-buttons">
    <button class="icon-btn" onclick="openHistory()">📋</button>
    <div class="categories">
      <button class="cat-btn">📂 ▼</button>
      <div class="cat-list" id="catList"></div>
    </div>
  </div>
</header>

<div class="search-section">
  <input type="text" id="searchInput" placeholder="🔍 Buscar producto...">
  <div class="filters-row">
    <select id="sortBy">
      <option value="default">Ordenar por</option>
      <option value="price-asc">💰 Menor precio</option>
      <option value="price-desc">💰 Mayor precio</option>
      <option value="name">📛 Nombre A-Z</option>
      <option value="offer">🔥 Ofertas primero</option>
    </select>
  </div>
</div>

<div class="products" id="productGrid"></div>

<button id="cartBtn" data-count="0">🛒</button>

<div id="qtyModal" class="modal">
  <div class="modal-content">
    <h3 id="qtyProductName"></h3>
    <div id="qtyProductPrices" style="margin:12px 0; font-size:14px;"></div>
    <div id="offerInfoModal" style="background:#fef3c7; color:#92400e; padding:10px; border-radius:8px; margin:10px 0; font-size:12px; display:none;"></div>
    <input type="number" id="qtyInput" value="1" min="1">
    <select id="qtyType">
      <option value="fardo">📦 Fardo</option>
      <option value="half">📦 Media caja</option>
      <option value="unit">🔹 Unidad</option>
    </select>
    <button id="confirmQty" style="background:#06b6d4; color:white; padding:10px; border:none; border-radius:8px; width:100%; margin-top:10px;">Agregar al carrito</button>
    <button id="cancelQty" style="background:#64748b; color:white; padding:10px; border:none; border-radius:8px; width:100%; margin-top:6px;">Cancelar</button>
  </div>
</div>

<div id="cartModal" class="modal">
  <div class="modal-content" style="max-width:500px; max-height:80vh; overflow-y:auto;">
    <span style="float:right; cursor:pointer; font-size:24px;" onclick="closeCartModal()">✖</span>
    <h2>🛒 Mi Carrito</h2>
    <div id="cartItems"></div>
    <label>👤 Nombre</label>
    <input id="clientName" placeholder="Tu nombre">
    <label>📍 Dirección</label>
    <textarea id="notes" rows="2" placeholder="Dirección de entrega"></textarea>
    <button id="sendWhats" style="background:#25D366; color:white; padding:12px; border:none; border-radius:8px; width:100%; margin-top:10px;">📱 Enviar pedido</button>
    <button id="clearCart" style="background:#ef4444; color:white; padding:12px; border:none; border-radius:8px; width:100%; margin-top:6px;">Vaciar carrito</button>
  </div>
</div>

<div id="historyPanel" class="history-panel">
  <button onclick="closeHistory()" style="float:right; background:none; border:none; color:white; font-size:24px;">✖</button>
  <h2>📋 Mis pedidos</h2>
  <div id="historyList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRzvwkeV8ceVnP5X2gA74a34iuClsc2qY",
  authDomain: "catalogo-f0b8e.firebaseapp.com",
  databaseURL: "https://catalogo-f0b8e-default-rtdb.firebaseio.com",
  projectId: "catalogo-f0b8e",
  storageBucket: "catalogo-f0b8e.firebasestorage.app",
  messagingSenderId: "100540032907",
  appId: "1:100540032907:web:a6acac793ff5c85884318e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const PHONE = "50259298965";

let products = [];
let cart = [];
let notificationPermission = false;
let notifiedOffers = JSON.parse(localStorage.getItem('notifiedOffers') || '{}');

const productGrid = document.getElementById("productGrid");
const searchInput = document.getElementById("searchInput");
const sortBy = document.getElementById("sortBy");

function formatPrice(p) {
  const num = parseFloat(p);
  if (isNaN(num)) return "Q0.00";
  return new Intl.NumberFormat('es-GT', { style: 'currency', currency: 'GTQ', minimumFractionDigits: 2 }).format(num);
}

function showToast(msg, isError = false) {
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = msg;
  toast.style.background = isError ? "#ef4444" : "#06b6d4";
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ========== NOTIFICACIONES PUSH ==========
async function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    const permission = await Notification.requestPermission();
    notificationPermission = permission === 'granted';
    if (notificationPermission) {
      showToast("🔔 Notificaciones activadas - Recibirás alertas de ofertas");
      localStorage.setItem('pushEnabled', 'true');
    }
  }
}

function sendNotification(title, body, icon = 'img/logo.png') {
  if (notificationPermission && document.hidden) {
    try {
      const notification = new Notification(title, { body, icon, silent: false });
      setTimeout(() => notification.close(), 5000);
    } catch(e) { console.log('Notificación no enviada'); }
  }
}

// Verificar ofertas nuevas y enviar notificación (100% funcional)
function checkAndNotifyNewOffers() {
  if (!products || products.length === 0) return;
  
  const now = new Date().toISOString();
  
  products.forEach(product => {
    const hasOffer = product.offer === true || (product.offerMinQty && product.offerMinQty > 0);
    
    if (hasOffer) {
      const lastNotified = notifiedOffers[product.id];
      const shouldNotify = !lastNotified || (new Date() - new Date(lastNotified) > 24 * 60 * 60 * 1000);
      
      if (shouldNotify) {
        let offerText = '';
        if (product.offerMinQty && product.offerPrice) {
          offerText = `🎯 Oferta por cantidad: Compra ${product.offerMinQty}+ y paga ${formatPrice(product.offerPrice)} c/u`;
        } else if (product.offerPrice) {
          offerText = `🔥 ¡OFERTA! ${formatPrice(product.offerPrice)} (antes ${formatPrice(product.price)})`;
        }
        
        if (offerText) {
          sendNotification(`🔥 Oferta: ${product.name}`, offerText, product.img);
          notifiedOffers[product.id] = now;
          localStorage.setItem('notifiedOffers', JSON.stringify(notifiedOffers));
        }
      }
    }
  });
}

// ========== VERIFICAR OFERTAS ==========
function getProductOffer(product) {
  // Oferta por cantidad
  if (product.offerMinQty && product.offerMinQty > 0 && product.offerPrice) {
    return {
      hasOffer: true,
      type: 'quantity',
      offerPrice: product.offerPrice,
      minQty: product.offerMinQty,
      message: `🎯 Oferta: Lleva ${product.offerMinQty}+ y paga ${formatPrice(product.offerPrice)} c/u`,
      badgeText: `🎯 ${product.offerMinQty}+ por ${formatPrice(product.offerPrice)}`
    };
  }
  // Oferta simple
  if (product.offer === true && product.offerPrice) {
    return {
      hasOffer: true,
      type: 'simple',
      offerPrice: product.offerPrice,
      minQty: null,
      message: `🔥 Oferta: ${formatPrice(product.offerPrice)}`,
      badgeText: `🔥 OFERTA ${formatPrice(product.offerPrice)}`
    };
  }
  return { hasOffer: false };
}

// ========== HISTORIAL ==========
function saveOrder(orderData) {
  const orders = JSON.parse(localStorage.getItem('orderHistory') || '[]');
  orders.push({
    id: Date.now(),
    date: new Date().toISOString(),
    cliente: orderData.clientName,
    total: orderData.total,
    items: orderData.items,
    address: orderData.address
  });
  localStorage.setItem('orderHistory', JSON.stringify(orders));
  renderHistory();
}

function renderHistory() {
  const historyDiv = document.getElementById("historyList");
  if (!historyDiv) return;
  const orders = JSON.parse(localStorage.getItem('orderHistory') || '[]');
  if (orders.length === 0) {
    historyDiv.innerHTML = '<p style="text-align:center; padding:40px;">📭 No hay pedidos aún</p>';
    return;
  }
  historyDiv.innerHTML = orders.slice().reverse().map(order => `
    <div class="history-item">
      <div><strong>📅 ${new Date(order.date).toLocaleDateString()}</strong></div>
      <div>👤 ${order.cliente || 'Anónimo'}</div>
      <div>💰 ${formatPrice(order.total)}</div>
      <div style="font-size:12px; color:#94a3b8;">${order.items.length} productos</div>
    </div>
  `).join('');
}

window.openHistory = function() {
  document.getElementById("historyPanel").classList.add("open");
  renderHistory();
};
window.closeHistory = function() { 
  document.getElementById("historyPanel").classList.remove("open"); 
};

// ========== CARRITO ==========
function updateCartBadge() {
  const total = cart.reduce((s, i) => s + i.quantity, 0);
  const btn = document.getElementById("cartBtn");
  if (total > 0) btn.setAttribute('data-count', total);
  else btn.removeAttribute('data-count');
}

function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); }
function loadCart() {
  const saved = localStorage.getItem('cart');
  if (saved) { cart = JSON.parse(saved); updateCartBadge(); renderCart(); }
}

function addToCart(product, quantity, type) {
  let basePrice = product.price;
  const qtyPerFardo = product.qtyPerFardo || 24;
  
  if (type === 'half') basePrice = product.priceHalf || product.price / 2;
  if (type === 'unit') basePrice = product.priceUnit || product.price / qtyPerFardo;
  
  let finalPrice = basePrice;
  let offerApplied = false;
  let offerText = '';
  
  const offer = getProductOffer(product);
  
  if (offer.hasOffer) {
    if (offer.type === 'quantity' && quantity >= offer.minQty) {
      finalPrice = offer.offerPrice;
      offerApplied = true;
      offerText = `🎯 Oferta por cantidad aplicada: ${formatPrice(offer.offerPrice)} c/u`;
      showToast(offerText);
    } else if (offer.type === 'simple') {
      finalPrice = offer.offerPrice;
      offerApplied = true;
      offerText = `🔥 Oferta aplicada: ${formatPrice(offer.offerPrice)} c/u`;
      showToast(offerText);
    } else if (offer.type === 'quantity' && quantity < offer.minQty) {
      offerText = `💡 Agrega ${offer.minQty - quantity} más para obtener oferta de ${formatPrice(offer.offerPrice)} c/u`;
      showToast(offerText);
    }
  }
  
  cart.push({
    id: Date.now() + Math.random(),
    productId: product.id,
    name: product.name,
    img: product.img,
    quantity: quantity,
    type: type,
    unitPrice: finalPrice,
    originalPrice: basePrice,
    offerApplied: offerApplied,
    offerText: offerText
  });
  
  saveCart();
  updateCartBadge();
  renderCart();
  if (!offerApplied && !offerText.includes('Agrega')) {
    showToast(`✅ ${quantity} ${type}(s) agregado`);
  }
}

function renderCart() {
  const cartDiv = document.getElementById("cartItems");
  if (!cartDiv) return;
  if (cart.length === 0) {
    cartDiv.innerHTML = '<div style="text-align:center;padding:20px;">🛒 Carrito vacío</div>';
    return;
  }
  
  let html = '';
  let total = 0;
  cart.forEach((item, idx) => {
    const subtotal = item.quantity * item.unitPrice;
    total += subtotal;
    html += `
      <div style="display:flex; gap:10px; margin-bottom:12px; padding:8px; background:#f1f5f9; border-radius:10px;">
        <img src="${item.img}" style="width:50px; height:50px; object-fit:contain;" onerror="this.src='https://via.placeholder.com/50'">
        <div style="flex:1">
          <div><strong>${item.name}</strong></div>
          <div>${item.quantity} ${item.type}(s)</div>
          ${item.offerApplied ? `<div style="color:#10b981; font-size:11px;">🎯 ${item.offerText || 'Oferta aplicada'}</div>` : ''}
          <div>💰 ${formatPrice(subtotal)} (${formatPrice(item.unitPrice)} c/u)</div>
        </div>
        <button onclick="window.removeFromCart(${idx})" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:6px;">🗑️</button>
      </div>
    `;
  });
  html += `<div style="margin-top:12px; padding-top:12px; border-top:2px solid #e2e8f0; text-align:right; font-weight:bold;">Total: ${formatPrice(total)}</div>`;
  cartDiv.innerHTML = html;
}

window.removeFromCart = function(idx) {
  cart.splice(idx, 1);
  saveCart();
  updateCartBadge();
  renderCart();
  showToast("🗑️ Producto eliminado");
};

window.closeCartModal = function() { 
  document.getElementById("cartModal").style.display = "none"; 
};

function sendWhatsAppOrder() {
  if (cart.length === 0) { showToast("🛒 Carrito vacío"); return; }
  
  const clientName = document.getElementById("clientName").value.trim() || "Cliente";
  const address = document.getElementById("notes").value.trim();
  let total = 0;
  
  let itemsText = "";
  cart.forEach((item, i) => {
    const subtotal = item.quantity * item.unitPrice;
    total += subtotal;
    itemsText += `${i+1}️⃣ ${item.quantity} ${item.type}(s) de *${item.name}* → ${formatPrice(subtotal)}\n`;
  });
  
  let message = `🛍️ *NUEVO PEDIDO*\n━━━━━━━━━━━━━━━━━━\n👤 *Cliente:* ${clientName}\n`;
  if (address) message += `📍 *Dirección:* ${address}\n`;
  message += `━━━━━━━━━━━━━━━━━━\n📦 *PRODUCTOS:*\n${itemsText}\n━━━━━━━━━━━━━━━━━━\n💰 *TOTAL:* ${formatPrice(total)}\n━━━━━━━━━━━━━━━━━━\n🙌 ¡Gracias por tu compra!`;
  
  saveOrder({
    clientName: clientName,
    total: total,
    items: cart.map(i => ({ name: i.name, qty: i.quantity, type: i.type })),
    address: address
  });
  
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(message)}`, "_blank");
  
  if (confirm("¿Vaciar carrito después de enviar?")) {
    cart = [];
    saveCart();
    updateCartBadge();
    renderCart();
    window.closeCartModal();
  }
}

// ========== RENDER PRODUCTOS ==========
function renderProducts() {
  if (!productGrid) return;
  
  let filtered = [...products];
  const searchTerm = searchInput.value.toLowerCase();
  if (searchTerm) {
    filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm) || (p.desc && p.desc.toLowerCase().includes(searchTerm)));
  }
  
  const sortValue = sortBy.value;
  if (sortValue === 'price-asc') filtered.sort((a,b) => (a.price || 0) - (b.price || 0));
  if (sortValue === 'price-desc') filtered.sort((a,b) => (b.price || 0) - (a.price || 0));
  if (sortValue === 'name') filtered.sort((a,b) => a.name.localeCompare(b.name));
  if (sortValue === 'offer') filtered.sort((a,b) => {
    const aOffer = getProductOffer(a).hasOffer ? 1 : 0;
    const bOffer = getProductOffer(b).hasOffer ? 1 : 0;
    return bOffer - aOffer;
  });
  
  if (filtered.length === 0) {
    productGrid.innerHTML = '<div style="text-align:center; padding:60px;">📦 No hay productos</div>';
    return;
  }
  
  productGrid.innerHTML = filtered.map(p => {
    const offer = getProductOffer(p);
    const stock = p.stock !== undefined ? p.stock : 999;
    const stockClass = stock === 0 ? 'out' : (stock <= 5 ? 'low' : 'available');
    const stockText = stock === 0 ? 'Agotado' : (stock <= 5 ? `⚠️ Stock: ${stock}` : 'Disponible');
    
    let priceHtml = '';
    let offerHtml = '';
    
    if (offer.hasOffer) {
      if (offer.type === 'quantity') {
        priceHtml = `
          <div class="price">
            <span class="old-price">${formatPrice(p.price)}</span>
            <span style="color:#10b981;">🎯 ${formatPrice(offer.offerPrice)} (${offer.minQty}+)</span>
          </div>
        `;
        offerHtml = `<div class="offer-info">💡 ${offer.message}</div>`;
      } else {
        priceHtml = `
          <div class="price">
            <span class="old-price">${formatPrice(p.price)}</span>
            ${formatPrice(offer.offerPrice)}
          </div>
        `;
      }
    } else {
      priceHtml = `<div class="price">${formatPrice(p.price)}</div>`;
    }
    
    return `
      <div class="product">
        ${offer.hasOffer ? `<div class="${offer.type === 'quantity' ? 'quantity-offer-badge' : 'offer-badge'}">${offer.badgeText}</div>` : ''}
        <div class="stock-badge ${stockClass}">${stockText}</div>
        <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=Producto'">
        <h3>${p.name}</h3>
        ${p.desc ? `<p class="desc">${p.desc.substring(0, 50)}${p.desc.length > 50 ? '...' : ''}</p>` : ''}
        ${priceHtml}
        ${offerHtml}
        <button class="btn-add" data-id="${p.id}" ${stock === 0 ? 'disabled' : ''}>${stock === 0 ? '❌ Agotado' : '➕ Agregar'}</button>
      </div>
    `;
  }).join('');
  
  document.querySelectorAll('.btn-add').forEach(btn => {
    if (!btn.disabled) {
      btn.onclick = () => {
        const product = products.find(p => p.id === btn.dataset.id);
        if (product) openQuantityModal(product);
      };
    }
  });
}

// ========== MODAL CANTIDAD ==========
let selectedProduct = null;

function openQuantityModal(product) {
  selectedProduct = product;
  document.getElementById("qtyProductName").textContent = product.name;
  
  const priceFardo = formatPrice(product.price);
  const priceHalf = formatPrice(product.priceHalf || product.price / 2);
  const priceUnit = formatPrice(product.priceUnit || product.price / (product.qtyPerFardo || 24));
  
  const offer = getProductOffer(product);
  const offerInfoDiv = document.getElementById("offerInfoModal");
  
  if (offer.hasOffer) {
    if (offer.type === 'quantity') {
      offerInfoDiv.innerHTML = `🎯 <strong>Oferta por cantidad:</strong> Compra ${offer.minQty}+ fardos y paga ${formatPrice(offer.offerPrice)} c/u (normal ${formatPrice(product.price)})`;
      offerInfoDiv.style.display = 'block';
    } else {
      offerInfoDiv.innerHTML = `🔥 <strong>Oferta especial:</strong> Precio ${formatPrice(offer.offerPrice)} (antes ${formatPrice(product.price)})`;
      offerInfoDiv.style.display = 'block';
    }
  } else {
    offerInfoDiv.style.display = 'none';
  }
  
  document.getElementById("qtyProductPrices").innerHTML = `
    📦 Fardo: ${priceFardo}<br>
    📦 Media caja: ${priceHalf}<br>
    🔹 Unidad: ${priceUnit}
  `;
  
  document.getElementById("qtyInput").value = 1;
  document.getElementById("qtyModal").style.display = "flex";
}

// ========== CATEGORÍAS ==========
function renderCategories() {
  const catList = document.getElementById("catList");
  const categories = ['Todos', ...new Set(products.map(p => p.category).filter(Boolean))];
  catList.innerHTML = categories.map(c => `<button onclick="window.filterByCategory('${c}')">${c}</button>`).join('');
}

window.filterByCategory = function(cat) {
  if (cat === 'Todos') renderProducts();
  else {
    const filtered = products.filter(p => p.category === cat);
    productGrid.innerHTML = filtered.map(p => `<div class="product">${p.name}</div>`).join('');
  }
  document.querySelector(".cat-list").style.display = "none";
};

// ========== CARGAR PRODUCTOS ==========
function loadProducts() {
  onValue(ref(db, 'products'), (snapshot) => {
    products = [];
    snapshot.forEach(child => {
      products.push({ id: child.key, ...child.val() });
    });
    renderCategories();
    renderProducts();
    checkAndNotifyNewOffers();
  });
}

// ========== EVENTOS ==========
document.getElementById("confirmQty").onclick = () => {
  if (selectedProduct) {
    const qty = parseInt(document.getElementById("qtyInput").value) || 1;
    const type = document.getElementById("qtyType").value;
    addToCart(selectedProduct, qty, type);
    document.getElementById("qtyModal").style.display = "none";
  }
};

document.getElementById("cancelQty").onclick = () => {
  document.getElementById("qtyModal").style.display = "none";
};

document.getElementById("sendWhats").onclick = sendWhatsAppOrder;
document.getElementById("clearCart").onclick = () => { 
  cart = []; 
  saveCart(); 
  updateCartBadge(); 
  renderCart(); 
  showToast("🧹 Carrito vaciado"); 
};
document.getElementById("cartBtn").onclick = () => {
  document.getElementById("cartModal").style.display = "flex";
};

searchInput.addEventListener('input', renderProducts);
sortBy.addEventListener('change', renderProducts);

document.querySelector(".cat-btn").onclick = (e) => {
  e.stopPropagation();
  const list = document.querySelector(".cat-list");
  list.style.display = list.style.display === 'flex' ? 'none' : 'flex';
};

document.addEventListener('click', () => document.querySelector(".cat-list").style.display = "none");

// ========== INICIALIZAR ==========
loadCart();
loadProducts();

// Pedir permiso para notificaciones al cargar (solo una vez)
setTimeout(() => {
  requestNotificationPermission();
}, 3000);
</script>
</body>
